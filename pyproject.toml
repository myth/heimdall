[project]
name = "heimdall"
version = "0.3.0"
description = "Systems monitoring service"
authors = ["Aleksander S. <myth@overflow.no>"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12.15",
    "aiosmtplib>=4.0.2",
    "aiosqlite>=0.21.0",
    "databases>=0.9.0",
    "fastapi>=0.116.1",
    "python-dateutil>=2.9.0.post0",
    "python-decouple>=3.8",
    "uvicorn>=0.35.0",
]
[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "ruff>=0.15.17",
    "types-python-dateutil>=2.9.0.20240316",
]

# Tools

[tool.ruff]
line-length = 120
target-version = 'py314'

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]


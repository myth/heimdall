[project]
name = "heimdall"
version = "0.3.0"
description = "Systems monitoring service"
authors = ["Aleksander S. <myth@overflow.no>"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "databases>=0.9.0",
    "fastapi>=0.162.0",
    "python-dateutil>=3.0.0",
    "python-decouple>=3.8",
    "uvicorn>=0.54.0",
]
[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "ruff>=0.17.2",
    "types-python-dateutil>=2.9.0.20261021",
]

# Tools

[tool.ruff]
line-length = 120
target-version = 'py314'

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]

